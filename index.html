<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Butelkomat</title>
<meta name="theme-color" content="#1f9d55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Butelkomat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{--bg:#f4f8f5;--card:#fff;--tx:#1b2a21;--mu:#6b7c72;--ac:#1f9d55;--bd:#dfe8e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a15;--card:#1a251f;--tx:#e8f1ec;--mu:#8fa297;--ac:#3fc37a;--bd:#2a382f}}
:root[data-theme="dark"]{--bg:#111a15;--card:#1a251f;--tx:#e8f1ec;--mu:#8fa297;--ac:#3fc37a;--bd:#2a382f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.w{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.mu{color:var(--mu);font-size:14px}
.tot{background:var(--ac);color:#fff;border-radius:20px;padding:22px;margin:16px 0;text-align:center}
.tot b{display:block;font-size:44px;margin-top:4px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.row .i{font-size:30px}
.row .n{flex:1}
.row .n strong{display:block;font-size:16px}
.c{font-size:22px;min-width:32px;text-align:center;font-weight:700}
button{font:inherit;border:0;cursor:pointer}
.p,.m{width:48px;height:48px;border-radius:50%;font-size:26px;line-height:1}
.p{background:var(--ac);color:#fff}
.m{background:var(--bd);color:var(--tx)}
.r{margin-top:14px;background:none;color:var(--mu);text-decoration:underline;font-size:14px}
#setup{text-align:center;padding-top:15vh}
input{width:100%;font:inherit;font-size:18px;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:16px 0 12px}
.go{width:100%;background:var(--ac);color:#fff;padding:14px;border-radius:14px;font-size:18px}
.hid{display:none}
label{display:block;text-align:left;font-size:14px;color:var(--mu);margin-top:6px}
#setup input{margin:6px 0 10px}
.goal{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:16px}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.left{font-size:14px;line-height:1.6}
.done{color:var(--ac);font-weight:700}
</style>
</head>
<body>
<div class="w">
<div id="setup" class="hid">
<div style="font-size:56px">♻️</div>
<h1>Witaj w Butelkomacie!</h1>
<label for="name">Jak masz na imię?</label>
<input id="name" placeholder="Twoje imię" maxlength="30" autocomplete="given-name">
<label for="gname">Na co zbierasz?</label>
<input id="gname" placeholder="np. rower, wakacje" maxlength="40">
<label for="gamt">Ile potrzebujesz uzbierać (zł)?</label>
<input id="gamt" type="number" inputmode="decimal" min="1" step="0.5" placeholder="np. 500">
<button class="go" id="start">Zaczynamy</button>
</div>
<div id="app" class="hid">
<h1 id="hi"></h1>
<div class="mu">Dodawaj oddane opakowania plusikiem</div>
<div class="tot"><span>Zaoszczędzono</span><b id="sum">0,00 zł</b></div>
<div class="goal"><strong id="gt"></strong>
<div class="bar"><i id="gb"></i></div>
<div class="left" id="gl"></div></div>
<div id="list"></div>
<button class="r" id="reset">Wyzeruj liczniki</button> <button class="r" id="edit">Zmień cel</button>
</div>
</div>
<script>
var ITEMS=[
 {k:"pet",icon:"🧴",name:"Butelka plastikowa",price:0.5},
 {k:"can",icon:"🥫",name:"Puszka aluminiowa",price:0.5},
 {k:"glass",icon:"🍾",name:"Butelka szklana",price:1}
];
var KEY="butelkomat_v2";
var st={name:"",goalName:"",goal:0,counts:{pet:0,can:0,glass:0}};
try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.name)st=Object.assign(st,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function zl(n){return n.toFixed(2).replace(".",",")+" zł"}
function $(id){return document.getElementById(id)}
function render(){
 var ok=st.name&&st.goal>0;
 $("setup").classList.toggle("hid",!!ok);
 $("app").classList.toggle("hid",!ok);
 if(!ok){$("name").value=st.name||"";$("gname").value=st.goalName||"";$("gamt").value=st.goal||"";return}
 $("hi").textContent="Cześć, "+st.name+"! 👋";
 var t=0,h="";
 ITEMS.forEach(function(it){
  var c=st.counts[it.k]||0;t+=c*it.price;
  h+='<div class="row"><div class="i">'+it.icon+'</div><div class="n"><strong>'+it.name+'</strong><span class="mu">'+zl(it.price)+' / szt.</span></div>'+
  '<button class="m" data-k="'+it.k+'" data-d="-1" aria-label="Odejmij">−</button><div class="c">'+c+'</div>'+
  '<button class="p" data-k="'+it.k+'" data-d="1" aria-label="Dodaj">+</button></div>';
 });
 $("list").innerHTML=h;
 $("sum").textContent=zl(t);
 var left=Math.max(0,st.goal-t),pct=Math.min(100,t/st.goal*100);
 $("gt").textContent="Cel: "+(st.goalName||"oszczędności")+" – "+zl(st.goal);
 $("gb").style.width=pct+"%";
 if(left<=0){$("gl").innerHTML='<span class="done">🎉 Cel osiągnięty! Brawo, '+st.name+'!</span>'}
 else{
  var pc=Math.ceil(left/0.5-1e-9),gl=Math.ceil(left-1e-9);
  $("gl").innerHTML="Zostało: <b>"+zl(left)+"</b> ("+Math.floor(pct)+"% celu)<br>To jeszcze:<br>🧴/🥫 <b>"+pc+"</b> plastików lub puszek<br>🍾 <b>"+gl+"</b> szklanych butelek";
 }
}
$("list").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 var k=b.dataset.k;st.counts[k]=Math.max(0,(st.counts[k]||0)+parseInt(b.dataset.d,10));
 save();render();
});
$("start").onclick=function(){
 var n=$("name").value.trim(),a=parseFloat($("gamt").value.replace(",","."));
 if(!n){$("name").focus();return}
 if(!(a>0)){$("gamt").focus();return}
 st.name=n;st.goalName=$("gname").value.trim();st.goal=a;save();render();
};
$("reset").onclick=function(){
 if(confirm("Wyzerować wszystkie liczniki?")){st.counts={pet:0,can:0,glass:0};save();render()}
};
$("edit").onclick=function(){st.goal=0;render()};
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
